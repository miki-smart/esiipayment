name: New provider request
description: Ask for a payment provider to be added, or claim one to work on yourself.
title: "[provider] Add <provider name>"
labels: ["new-provider", "adapter"]
body:
  - type: markdown
    attributes:
      value: |
        Read [docs/add-a-provider.md](../../docs/add-a-provider.md) first —
        it walks through the whole process. This issue is for requesting
        or claiming a provider, not for the adapter PR itself.

        Almost every provider is onboarded as a **manifest** (one YAML
        file, no programming, works in every runtime at once). A small
        number need the **native** path instead — code per language
        runtime — because the DSL structurally cannot describe them. If
        you already suspect that applies here, say so in the last field
        and name the specific obstacle;
        [Step 0](../../docs/tutorials/add-a-provider/00-which-kind.md)
        walks the decision. Getting talked out of a native
        implementation is a good outcome.
  - type: input
    id: provider-name
    attributes:
      label: Provider name
      placeholder: e.g. Kaafi, M-Birr, HelloCash
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does this provider offer?
      description: Market (Ethiopia-wide, specific region), payment methods (mobile money, bank transfer, cards, USSD), and anything distinctive about its integration.
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Are you volunteering to write this adapter?
      options:
        - "Yes, I'll open the PR myself"
        - "No, I'm requesting someone else pick this up"
    validations:
      required: true
  - type: textarea
    id: knowledge-source
    attributes:
      label: Where does your knowledge of this provider's API come from?
      description: >-
        Public documentation, your own sandbox testing, prior integration
        experience written up from memory (never from an employer's
        proprietary source — see the clean-room note in CONTRIBUTING.md).
        This isn't a gate to request a provider, but if you plan to write
        the adapter yourself it's worth thinking about now.
  - type: textarea
    id: expressibility
    attributes:
      label: Anything about this provider's API that a manifest might not be able to describe?
      description: >-
        Optional, and only answer if something specific comes to mind: a
        signature over sorted/concatenated parameters rather than the raw
        body, an opaque session or cookie carried between calls, a
        non-HTTP channel (SOAP, gRPC, a vendor SDK, a USSD gateway), or a
        status you can only classify by combining two fields. Those are
        the signals that mean the native path. Anything else — verbose
        status vocabularies, many error cases, an inelegant flow — is
        still an ordinary manifest.
