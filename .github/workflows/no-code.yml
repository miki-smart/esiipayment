name: no-code

# The governing rule of this repository: no application code, in any
# language, under providers/, vectors/, or schema/ — see
# spec/00-overview.md. This check is deliberately a plain shell script,
# not a run of `esiipayment lint` (which enforces the same rule) — a rule
# this load-bearing gets an independent, dependency-free gate that does
# not rely on the validator tool building correctly.
#
# This applies identically to a native provider (providers/<name>/
# capabilities.yaml with implementation: native; see
# spec/03-manifest-dsl.md#native-providers). A native provider's actual
# implementation is hand-written code, but that code lives in each
# language SDK's own repository, never in this one: this repository holds
# only capabilities.yaml, metadata.yaml, cassettes/, and expected/ for it,
# same as any manifest.yaml-driven provider. Declaring
# `implementation: native` does not create an exception to this rule —
# there is no code-file extension for the scan below to special-case.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-code-in-data-dirs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan for forbidden code file extensions
        run: |
          set -euo pipefail
          PATTERN='\.(cs|py|ts|js|go|php|rb|java)$'
          HITS=""
          for dir in providers vectors schema; do
            if [ -d "$dir" ]; then
              FOUND=$(find "$dir" -type f | grep -E "$PATTERN" || true)
              if [ -n "$FOUND" ]; then
                HITS="$HITS
          $FOUND"
              fi
            fi
          done
          if [ -n "$HITS" ]; then
            echo "Application code found under providers/, vectors/, or schema/:"
            echo "$HITS"
            echo
            echo "This repository contains no application code outside tools/ — see spec/00-overview.md."
            exit 1
          fi
          echo "No forbidden code files found."
