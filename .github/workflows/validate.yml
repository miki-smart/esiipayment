name: validate

# Runs the reference validator (tools/validator) against every changed
# provider on a PR, plus a repo-wide lint. See tools/validator/README.md
# and spec/06-conformance.md for what these checks cover.
#
# Native providers (providers/<name>/capabilities.yaml with
# implementation: native; see spec/03-manifest-dsl.md#native-providers)
# need no special-casing here: `esiipayment validate` detects
# capabilities.yaml and validates it (plus cassette/golden-file coverage)
# instead of manifest.yaml, and `esiipayment replay --assert-golden`
# prints an informational message and exits 0 rather than erroring, since
# this reference tool has no manifest to replay a native provider's
# cassettes against — that verification is each native implementation's
# own conformance suite's job.

on:
  pull_request:
    paths:
      - "providers/**"
      - "schema/**"
      - "vectors/**"
      - "tools/validator/**"
  push:
    branches: [main]

jobs:
  changed-providers:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.diff.outputs.providers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          # Any "_"-prefixed directory is a skeleton with intentional
          # TODOs (_template, _template-native) and is not expected to
          # validate — same convention esiipayment lint/catalog apply.
          # --diff-filter=d drops deletions: a PR that removes a provider
          # outright would otherwise put its name in the matrix and fail on
          # `esiipayment validate providers/<gone>`.
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- providers/ | awk -F/ '{print $2}' | sort -u | grep -v '^_' || true)
          JSON=$(printf '%s\n' "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "providers=$JSON" >> "$GITHUB_OUTPUT"

  validate:
    needs: changed-providers
    if: needs.changed-providers.outputs.providers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.changed-providers.outputs.providers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/validator/go.sum
      - name: build esiipayment
        working-directory: tools/validator
        run: go build -o /usr/local/bin/esiipayment ./cmd/esiipayment
      - name: esiipayment validate
        run: esiipayment validate providers/${{ matrix.provider }}
      - name: esiipayment replay --assert-golden
        run: esiipayment replay providers/${{ matrix.provider }} --assert-golden

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/validator/go.sum
      - name: build esiipayment
        working-directory: tools/validator
        run: go build -o /usr/local/bin/esiipayment ./cmd/esiipayment
      - name: esiipayment lint
        run: esiipayment lint .

  # The validator is the reference implementation every provider PR is
  # gated on, so its own tests have to run somewhere. They did not before:
  # no workflow in this repo invoked `go test`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/validator/go.sum
      - name: go test
        working-directory: tools/validator
        run: go test ./...
      # Catches the drift `go mod tidy` in CI used to hide: if go.mod or
      # go.sum is incomplete or stale, this fails here rather than being
      # silently rewritten on the runner.
      - name: go.mod / go.sum are tidy
        working-directory: tools/validator
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in tools/validator and commit the result."
            exit 1
          }
