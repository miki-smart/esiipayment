name: conformance-matrix

# Fans out to every language SDK repo on a {sdk} x {provider} matrix so a
# manifest change that breaks a runtime fails on the manifest PR itself,
# not later in some other repo — see spec/06-conformance.md.
#
# This repo only controls the dispatch side: each entry in `sdks` below
# must have a workflow listening for a repository_dispatch event of type
# `esiipayment-conformance-check`, whose payload is
# {"provider": "<name>", "sha": "<this repo's commit>"}. That workflow is
# expected to:
#   1. update its esiipayment-spec submodule to the given sha,
#   2. run its own runtime's conformance suite against providers/<provider>
#      (validate the manifest, replay every cassette, assert golden output
#      per spec/06-conformance.md and spec/07-runtime-requirements.md),
#   3. report a commit status (or check run) back on this repo's sha,
#      named e.g. "conformance/<sdk>/<provider>", so branch protection on
#      this repo can require it.
#
# NOTE: miki-smart/esiipayment-dotnet exists but has not yet implemented
# the receiving workflow; esiipayment-python/esiipayment-node/esiipayment-go/
# esiipayment-php do not exist as repositories at all. This file defines
# the contract this repo commits to on the dispatch side, ready for each
# SDK repo to implement the matching receiver. Until then, dispatches
# below fail with "repository not found" for any sdk repo that hasn't been
# created yet; that failure should not block merges on this repo until at
# least one real SDK repo implements the receiver (adjust branch
# protection accordingly).
#
# The owner below is miki-smart, matching where every repo in this project
# actually lives (miki-smart/esiipayment, miki-smart/esiipayment-dotnet).
# It read "esiipayment/" until 2026-08-04, which made every dispatch 404
# regardless of whether the target repo existed.

on:
  push:
    branches: [main]
    paths:
      - "providers/**"
      - "schema/**"
      - "spec/**"

jobs:
  changed-providers:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.diff.outputs.providers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # grep -v '^_' (not '^_template$'): every "_"-prefixed directory
          # is a skeleton with intentional TODOs — _template and, since the
          # native-provider work, _template-native — and must never be
          # dispatched to an SDK as if it were a shippable provider. Same
          # convention validate.yml and esiipayment lint/catalog apply.
          CHANGED=$(git diff --name-only --diff-filter=d HEAD~1 HEAD -- providers/ | awk -F/ '{print $2}' | sort -u | grep -v '^_' || true)
          JSON=$(printf '%s\n' "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "providers=$JSON" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: changed-providers
    if: needs.changed-providers.outputs.providers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - esiipayment-dotnet
          - esiipayment-python
          - esiipayment-node
          - esiipayment-go
          - esiipayment-php
        provider: ${{ fromJson(needs.changed-providers.outputs.providers) }}
    steps:
      - name: dispatch conformance check to ${{ matrix.sdk }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CONFORMANCE_DISPATCH_TOKEN }}
          repository: miki-smart/${{ matrix.sdk }}
          event-type: esiipayment-conformance-check
          client-payload: |-
            {"provider": "${{ matrix.provider }}", "sha": "${{ github.sha }}"}
