# yaml-language-server: $schema=https://spec.esiipayment.et/schema/cassette.v1.schema.json
#
# Illustrative reconstruction of a bad API key; see the PROVISIONAL
# banner in ../manifest.yaml. Exercises the `http_status: 401` entry in
# manifest.yaml's errors list.
name: collect.auth_failed
operation: collect
seed:
  clock: "2026-01-15T09:30:00Z"
  uuid: []
  idempotency_key: "ARIFPAY-COLLECT-AUTH-0001"
environment: sandbox
ctx:
  webhook_url: "https://merchant.example/webhooks/arifpay"
  return_url: "https://merchant.example/return/arifpay"
  cancel_url: "https://merchant.example/cancel/arifpay"
  settlement_account: "1000234567890"
credentials:
  api_key: "fixture-not-a-real-key"
intent:
  amount: 15000
  currency: ETB
  phone: "0912345678"
  email: "customer@example.com"
  expires_at: "2026-01-15T10:30:00Z"
interactions:
  - request:
      method: POST
      path: /api/checkout/session
      headers: { x-arifpay-key: "fixture-not-a-real-key" }
      body: '{"phone":"251912345678","email":"customer@example.com","expireDate":"2026-01-15T10:30:00Z","cancelUrl":"https://merchant.example/cancel/arifpay","successUrl":"https://merchant.example/return/arifpay","errorUrl":"https://merchant.example/return/arifpay","notifyUrl":"https://merchant.example/webhooks/arifpay","beneficiaries":{"accountNumber":"1000234567890","amount":"150.00"}}'
    response:
      status: 401
      headers: { content-type: application/json }
      # Deliberately without an "error" field: if this body also matched
      # the `path: $.error, equals: true` entry above, that would be
      # exactly the authoring ambiguity spec/03-manifest-dsl.md warns
      # against: a 401 in this reconstruction is modeled as a bare
      # unauthorized response with no body-level "error" flag at all.
      body: '{"msg":"Unauthorized"}'
