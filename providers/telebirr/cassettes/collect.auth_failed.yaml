# yaml-language-server: $schema=https://spec.esiipayment.et/schema/cassette.v1.schema.json
#
# Illustrative reconstruction of a bad/expired bearer token; see the
# PROVISIONAL banner in ../manifest.yaml. Exercises the `http_status: 401`
# entry, not a body-content match: the body deliberately carries no "code"
# field so it cannot also match the `collect.invalid_request` entry.
name: collect.auth_failed
operation: collect
seed:
  clock: "2026-01-15T09:30:00Z"
  uuid: []
  idempotency_key: "TELEBIRR-COLLECT-AUTH-0001"
environment: sandbox
ctx:
  webhook_url: "https://merchant.example/webhooks/telebirr"
  fabric_app_id: "fixture-merchant-app-id"
credentials:
  access_token: "expired-fixture-token"
intent:
  amount: 15000
  currency: ETB
interactions:
  - request:
      method: POST
      path: /payment/v1/merchant/preOrder
      headers: { Authorization: "Bearer expired-fixture-token" }
      body: '{"biz_content":{"notify_url":"https://merchant.example/webhooks/telebirr","appid":"fixture-merchant-app-id","merch_order_id":"TELEBIRR-COLLECT-AUTH-0001","title":"Merchant order","total_amount":"150.00","trans_currency":"ETB","timeout_express":"120m"}}'
    response:
      status: 401
      headers: { content-type: application/json }
      body: '{"message":"Unauthorized"}'
