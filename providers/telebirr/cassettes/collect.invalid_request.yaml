# yaml-language-server: $schema=https://spec.esiipayment.et/schema/cassette.v1.schema.json
#
# Illustrative reconstruction of a preOrder-time validation failure; see
# the PROVISIONAL banner in ../manifest.yaml. Exercises the
# `path: $.code, equals: FAIL` entry in manifest.yaml's errors list. The
# failure body deliberately has no biz_content, so it cannot also match a
# success-shaped extraction.
name: collect.invalid_request
operation: collect
seed:
  clock: "2026-01-15T09:30:00Z"
  uuid: []
  idempotency_key: "TELEBIRR-COLLECT-INVALID-0001"
environment: sandbox
ctx:
  webhook_url: "https://merchant.example/webhooks/telebirr"
  fabric_app_id: "fixture-merchant-app-id"
credentials:
  access_token: "fixture-not-a-real-token"
intent:
  amount: 15000
  currency: ETB
interactions:
  - request:
      method: POST
      path: /payment/v1/merchant/preOrder
      headers: { Authorization: "Bearer fixture-not-a-real-token" }
      body: '{"biz_content":{"notify_url":"https://merchant.example/webhooks/telebirr","appid":"fixture-merchant-app-id","merch_order_id":"TELEBIRR-COLLECT-INVALID-0001","title":"Merchant order","total_amount":"150.00","trans_currency":"ETB","timeout_express":"120m"}}'
    response:
      status: 200
      headers: { content-type: application/json }
      body: '{"code":"FAIL","msg":"Invalid merchant order"}'
