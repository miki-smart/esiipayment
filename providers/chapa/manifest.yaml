# yaml-language-server: $schema=https://spec.esiipayment.et/schema/manifest.v1.schema.json
#
# PROVISIONAL: see providers/chapa/metadata.yaml. This manifest is written
# from general, possibly-outdated recollection of Chapa's public API, not
# from current, verified documentation. Endpoint paths, exact field names,
# and the webhook signature scheme are marked inline below where confidence
# is lowest, and must be confirmed against https://developer.chapa.co
# before this manifest is used against a real (even sandbox) Chapa account.
# The cassettes in providers/chapa/cassettes/ are illustrative reconstructions
# of plausible responses, not recorded real traffic.

provider: chapa
spec_version: "2.0"
display_name: "Chapa"
country: ET
# Chapa's own docs (as last recalled) advertise ETB as the primary
# settlement currency for local payment methods; card payments may support
# additional currencies. Left at ETB only pending verification; adding
# USD here without confirming it is actually accepted is worse than
# omitting it.
currencies: [ETB]

environments:
  # UNVERIFIED: recollection is that Chapa uses a single API host for both
  # test and live traffic, distinguished by which secret key (test-prefixed
  # vs live-prefixed; see auth.fields below) is sent, rather than separate
  # sandbox/production hosts. If that is wrong, both entries below need
  # distinct base_urls instead.
  sandbox:
    base_url: https://api.chapa.co
  production:
    base_url: https://api.chapa.co

# --8<-- [start:auth-section]
auth:
  # VERIFIED (2026-08-02, live sandbox): bearer secret_key on
  # /v1/transaction/initialize and /v1/transaction/verify is correct, and
  # the CHASECK_TEST- test-key prefix is real.
  #
  # Shape widened from api_key to triple_key: Chapa issues four distinct
  # credential values (public key, secret key, encryption key, and a
  # separate webhook signing secret), not one. triple_key is the closest
  # member of the closed CredentialShape set
  # (spec/01-domain-model.md#credentialshape) — the spec requires picking
  # the nearest existing shape rather than inventing a four-value one.
  # Only secret_key reaches an outbound request (via apply below);
  # webhook_secret is used solely by the webhook section, and
  # public_key/encryption_key exist for direct card/mobile-money charge
  # modes this manifest does not implement.
  shape: triple_key
  fields:
    - name: secret_key
      description: >-
        Secret key from the Chapa merchant dashboard. Test keys are
        prefixed CHASECK_TEST-, live keys CHASECK-. Sent as
        "Authorization: Bearer <secret_key>" on every request.
    - name: webhook_secret
      description: >-
        The webhook signing secret, set separately in the Chapa dashboard's
        webhook settings. This is NOT the same value as secret_key; using
        secret_key to verify callbacks will reject every legitimate webhook.
    - name: public_key
      description: >-
        Public key (CHAPUBK_...), used by client-side/inline integration
        modes this manifest does not implement. Collected for completeness.
    - name: encryption_key
      description: >-
        Encryption key, used to encrypt card fields when accepting card
        payments directly — an integration mode this manifest does not
        implement. Collected for completeness.
  apply:
    header: Authorization
    value: "Bearer ${credentials.secret_key}"
# --8<-- [end:auth-section]

# --8<-- [start:capabilities-section]
capabilities:
  operations: [collect, sync, webhook]
  next_actions: [RedirectToUrl, Poll]
  currencies:
    ETB:
      # UNVERIFIED limits: placeholders, not values read from Chapa
      # documentation. Confirm actual min/max before certifying this
      # manifest.
      min_amount: 100
      max_amount: 100000000
# --8<-- [end:capabilities-section]

# --8<-- [start:operations-section]
operations:
  collect:
    entry_flow: collect
  sync:
    entry_flow: sync
  webhook:
    entry_flow: webhook
# --8<-- [end:operations-section]

# --8<-- [start:flows-section]
flows:
  # Hosted-checkout pattern: initialize returns a checkout_url the payer is
  # redirected to; the actual outcome arrives later via sync (verify) or
  # webhook.
  # --8<-- [start:flows-collect-section]
  collect:
    steps:
      initialize:
        call:
          method: POST
          # UNVERIFIED path: recalled as /v1/transaction/initialize.
          path: /v1/transaction/initialize
          body:
            amount: ${amount_major(intent.amount)}
            currency: ${intent.currency}
            # UNVERIFIED: Chapa's hosted checkout has historically required
            # payer email/name fields on this call. Field names as
            # recalled; confirm against current docs. A runtime's public
            # collect() API would need to accept these as part of intent
            # for this provider.
            email: ${intent.email}
            first_name: ${intent.first_name}
            last_name: ${intent.last_name}
            tx_ref: ${idempotency_key}
            callback_url: ${ctx.webhook_url}
            return_url: ${ctx.return_url}
        triggers: [return]
        status_map:
          path: $.status
          values:
            success: awaiting_redirect
        emit: {}

      awaiting_redirect:
        emit:
          status: RequiresAction
          next_action:
            type: RedirectToUrl
            url: ${extract.data.checkout_url}
  # --8<-- [end:flows-collect-section]

  sync:
    steps:
      query:
        call:
          method: GET
          # UNVERIFIED path: recalled as /v1/transaction/verify/{tx_ref}.
          path: /v1/transaction/verify/${idempotency_key}
        triggers: [return]
        status_map:
          path: $.data.status
          values:
            success: succeeded
            pending: still_processing
        emit: {}

      succeeded:
        emit: { status: Succeeded }
      still_processing:
        emit: { status: Processing, next_action: { type: Poll, interval_ms: 5000 } }

  webhook:
    steps:
      receive:
        triggers: [webhook]
        status_map:
          path: $.status
          values:
            success: succeeded
        emit: {}

      succeeded:
        emit: { status: Succeeded }
# --8<-- [end:flows-section]

# --8<-- [start:errors-section]
errors:
  # Initialize-time validation failure (missing/malformed field).
  #
  # CORRECTED 2026-08-02 against the live sandbox. This entry previously
  # matched `path: $.status, equals: failed`, on the recollection that
  # Chapa returns 200 with a top-level failed status for validation
  # errors. Both halves of that were wrong, and the second one was a real
  # bug:
  #   1. A validation failure is HTTP 400, not 200. Observed:
  #      {"message":{"email":["validation.email"]},"status":"failed","data":null}
  #   2. Chapa's 401 body ALSO carries top-level "status":"failed", so the
  #      old condition matched the auth-failure response too — making this
  #      entry and the `http_status: 401` entry below both true of one
  #      response. Per spec/03-manifest-dsl.md that is an authoring
  #      ambiguity, explicitly NOT something to resolve by entry order, and
  #      a runtime taking first-match-wins would have reported a bad API
  #      key as InvalidRequest instead of AuthFailed.
  # Matching on http_status 400 vs 401 keeps the two mutually exclusive.
  - match:
      http_status: 400
    failure_code: InvalidRequest
    retry_class: DoNotRetry

  # Verify-time outcome: the provider processed the payment and it did not
  # succeed (declined, expired session, etc). UNVERIFIED whether Chapa
  # distinguishes decline reasons at this endpoint; modeled here as a
  # single generic decline.
  - match:
      path: $.data.status
      equals: failed
    failure_code: AuthorizationDeclined
    retry_class: DoNotRetry

  # Bad/expired secret key. VERIFIED 2026-08-02 against the live sandbox:
  # Chapa does return a bare 401 for this. Observed body:
  # {"message":"Invalid API Key or the business can't accept payments at
  # the moment...","status":"failed","data":null}
  - match:
      http_status: 401
    failure_code: AuthFailed
    retry_class: DoNotRetry

  - match:
      transport: timeout
    failure_code: ProviderTimeout
    retry_class: ResolveFirst
# --8<-- [end:errors-section]

# --8<-- [start:webhook-section]
webhook:
  verification:
    # CORRECTED 2026-08-02: `secret` now references the dedicated
    # webhook_secret credential, not secret_key. Chapa issues a separate
    # webhook signing secret in its dashboard's webhook settings; verifying
    # against the API secret key would have rejected every legitimate
    # callback. (Evidenced by a real merchant configuration carrying
    # distinct CHAPA_SECRET_KEY and CHAPA_WEBHOOK_SECRET values.)
    #
    # STILL UNVERIFIED: the scheme and header name below. HMAC-SHA256 hex
    # over the raw body is consistent with Chapa's published CLI having a
    # `webhook verifywebhook --usekey` signature check, but the exact
    # header name ("Chapa-Signature" vs "x-chapa-signature" — Chapa is
    # reported to send both) and the hex-vs-base64 encoding were NOT
    # confirmed first-hand: doing so needs a real inbound callback, which
    # a sandbox initialize call alone does not produce. Confirm before
    # relying on this in production.
    scheme: hmac_sha256_hex
    signature_header: Chapa-Signature
    secret: ${credentials.webhook_secret}
  body_format: json
# --8<-- [end:webhook-section]
