#
# Illustrative reconstruction of an inbound webhook; see the PROVISIONAL
# banner in ../manifest.yaml, especially regarding the signature header
# name and scheme. The signature below is a REAL HMAC-SHA256 hex digest,
# computed over the exact raw_body bytes using the fixture secret in
# `credentials`, not a real Chapa signature, since credentials.webhook_secret
# here is a fixture, not a live key.
#
# The fixture's VALUE is unchanged from when this key was named secret_key
# (the manifest now correctly reads webhook_secret instead), so the
# precomputed digest below still verifies: HMAC depends on the secret's
# value, not on which manifest field name carries it.
name: webhook.succeeded
operation: webhook
seed:
  clock: "2026-01-15T09:30:00Z"
  uuid: []
  idempotency_key: "CHAPA-WEBHOOK-SUCCEEDED-0001"
credentials:
  webhook_secret: "chapa_test_fixture_secret_5f8a3b2c"
inbound_webhook:
  headers:
    content-type: application/json
    Chapa-Signature: "d2498b9fca7afd0d85d4ad8817abd2e4bf79781001bbf37df8bc3c9dba8d2e49"
  body: '{"event":"charge.success","tx_ref":"CHAPA-WEBHOOK-SUCCEEDED-0001","status":"success","amount":"150.00","currency":"ETB"}'
interactions: []
