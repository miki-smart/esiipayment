# yaml-language-server: $schema=https://spec.esiipayment.et/schema/cassette.v1.schema.json
#
# Illustrative reconstruction of a bad/expired secret key; see the
# PROVISIONAL banner in ../manifest.yaml. Exercises the `http_status: 401`
# entry in manifest.yaml's errors list, not a body-content match.
name: collect.auth_failed
operation: collect
seed:
  clock: "2026-01-15T09:30:00Z"
  uuid: []
  idempotency_key: "CHAPA-COLLECT-AUTH-0001"
environment: sandbox
ctx:
  webhook_url: "https://merchant.example/webhooks/chapa"
  return_url: "https://merchant.example/return/chapa"
credentials:
  secret_key: "CHASECK_TEST-fixture-not-a-real-key"
intent:
  amount: 15000
  currency: ETB
  email: "customer@example.com"
  first_name: "Abebe"
  last_name: "Kebede"
interactions:
  - request:
      method: POST
      path: /v1/transaction/initialize
      body: '{"amount":"150.00","currency":"ETB","email":"customer@example.com","first_name":"Abebe","last_name":"Kebede","tx_ref":"CHAPA-COLLECT-AUTH-0001","callback_url":"https://merchant.example/webhooks/chapa","return_url":"https://merchant.example/return/chapa"}'
    response:
      status: 401
      headers: { content-type: application/json }
      body: '{"message":"Invalid authorization key"}'
