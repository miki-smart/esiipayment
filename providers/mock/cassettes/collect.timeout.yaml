# yaml-language-server: $schema=https://spec.esiipayment.et/schema/cassette.v1.schema.json
# Simulates a connection timeout: the request was sent but no response was ever received. Per Invariant I4, this must resolve to Processing + Poll, never Failed.
name: collect.timeout
operation: collect
seed:
  clock: "2026-01-15T09:30:00Z"
  uuid: []
  idempotency_key: "MOCK-COLLECT-TIMEOUT-0001"
environment: sandbox
intent:
  amount: 10000
  currency: ETB
  method: timeout
transport_failure: true
interactions:
  - request:
      method: POST
      path: /v1/collect
      body: '{"scenario":"timeout","amount":"100.00","currency":"ETB","reference":"MOCK-COLLECT-TIMEOUT-0001"}'
